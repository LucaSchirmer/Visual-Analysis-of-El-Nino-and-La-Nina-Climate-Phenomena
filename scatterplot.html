<header class="main-header">

  <!-- Timeline -->
  <div id="timeline-chart"></div>

<!-- 1. Libraries -->
<script src="scripts/d3.v7.min.js"></script>

<script src="scripts/data_rainfall_by_country.js"></script>
<script src="scripts/data_fishing_by_country_year.js"></script>

<script src="scripts/scatter-plot.js"></script>
<script src="scripts/timeline.js"></script>

<!-- 5. Initialize visualizations -->
<script>
  document.addEventListener('DOMContentLoaded', async function() {
    try {
      await createScatterPlot();
      await createTimelineScale(false);
    } catch (error) {
      console.error('Error initializing visualizations:', error);
    }
  });
