<html lang="en">
<head>

  <link rel="stylesheet" href="styles/main.css" />

<body>
<header class="main-header">

        <a href="about.html" class="footer-link">About</a> — 2025 Created for the Challenge Open Data.

<script src="scripts/d3.v7.min.js"></script>

<script src="scripts/data_rainfall_by_country.js"></script>
